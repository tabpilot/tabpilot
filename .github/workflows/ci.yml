name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  NODE_VERSION: '26'

# Cancel in-progress runs on the same branch when a new push arrives
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# ─── Reusable setup ───────────────────────────────────────────────────────────
# Every job that needs Node + Yarn uses this identical block so caches are shared.

jobs:
  # ── Lint & format ─────────────────────────────────────────────────────────
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Enable Corepack first
        run: |
          corepack enable
          corepack prepare yarn@4.13.0 --activate

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Yarn cache
        id: yarn-cache
        uses: actions/cache@v6.1.0
        with:
          path: .yarn/cache
          key: yarn-${{ runner.os }}-${{ hashFiles('**/yarn.lock') }}
          restore-keys: yarn-${{ runner.os }}-

      - run: yarn install --immutable

      - name: Biome (lint + format)
        run: yarn biome ci .

  # ── Type-check ────────────────────────────────────────────────────────────
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Enable Corepack first
        run: |
          corepack enable
          corepack prepare yarn@4.13.0 --activate

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Yarn cache
        uses: actions/cache@v6.1.0
        with:
          path: .yarn/cache
          key: yarn-${{ runner.os }}-${{ hashFiles('**/yarn.lock') }}
          restore-keys: yarn-${{ runner.os }}-

      - run: yarn install --immutable

      - name: Build shared package
        run: yarn workspace @tabpilot/shared build

      - name: Type-check API
        id: typecheck_api
        continue-on-error: true
        run: yarn workspace @tabpilot/api typecheck

      - name: Type-check Web
        id: typecheck_web
        continue-on-error: true
        run: yarn workspace @tabpilot/web typecheck

      - name: Fail if any typecheck failed
        if: steps.typecheck_api.outcome == 'failure' || steps.typecheck_web.outcome == 'failure'
        run: exit 1

  # ── Unit tests ────────────────────────────────────────────────────────────
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0  # SonarCloud needs full history for blame/new-code analysis

      - name: Enable Corepack first
        run: |
          corepack enable
          corepack prepare yarn@4.13.0 --activate

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Yarn cache
        uses: actions/cache@v6.1.0
        with:
          path: .yarn/cache
          key: yarn-${{ runner.os }}-${{ hashFiles('**/yarn.lock') }}
          restore-keys: yarn-${{ runner.os }}-

      # Cache the mongodb-memory-server binary so it's only downloaded once
      - name: mongodb-memory-server binary cache
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-7
          restore-keys: mongodb-binaries-

      - run: yarn install --immutable

      - name: Build shared package
        run: yarn workspace @tabpilot/shared build

      - name: API tests
        id: test_api
        continue-on-error: true
        run: yarn test:api:cov
        env:
          MONGODB_URI: mongodb://localhost:27017/tabpilot_test
          NODE_ENV: test

      - name: Web tests
        id: test_web
        continue-on-error: true
        run: yarn test:web:cov
        env:
          NODE_ENV: test

      - name: Fail if any tests failed
        if: steps.test_api.outcome == 'failure' || steps.test_web.outcome == 'failure'
        run: exit 1

      - name: Upload coverage reports
        uses: actions/upload-artifact@v7.0.1
        with:
          name: coverage
          path: |
            apps/api/coverage/lcov.info
            apps/web/coverage/lcov.info
          retention-days: 1

      - name: Test summary
        if: always()
        run: |
          echo "## Test Results" >> $GITHUB_STEP_SUMMARY
          echo "| Suite | Command |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
          echo "| API (Jest) | \`yarn test:api:cov\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Web (Vitest) | \`yarn test:web:cov\` |" >> $GITHUB_STEP_SUMMARY

  # ── SonarCloud analysis ───────────────────────────────────────────────────
  sonar:
    name: SonarCloud
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Download coverage reports
        uses: actions/download-artifact@v8.0.1
        with:
          name: coverage
          path: apps  # upload-artifact strips the common 'apps/' prefix; restoring it here

      - name: Install dirmngr
        run: sudo apt-get install -y dirmngr

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # ── Build verification ────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Enable Corepack first
        run: |
          corepack enable
          corepack prepare yarn@4.13.0 --activate

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Yarn cache
        uses: actions/cache@v6.1.0
        with:
          path: .yarn/cache
          key: yarn-${{ runner.os }}-${{ hashFiles('**/yarn.lock') }}
          restore-keys: yarn-${{ runner.os }}-

      - run: yarn install --immutable

      - name: Build shared
        run: yarn workspace @tabpilot/shared build

      - name: Build web
        run: yarn workspace @tabpilot/web build

      - name: Build API
        run: yarn workspace @tabpilot/api build

  # ── Container image ───────────────────────────────────────────────────────
  publish:
    name: Build & Push Image
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test, build]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Image metadata (without docs)
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=master,enable={{is_default_branch}}

      - name: Image metadata (with docs)
        id: meta-docs
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short,suffix=-docs
            type=raw,value=master-docs,enable={{is_default_branch}}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@v4.5.1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (without docs)
        id: push
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: Containerfile
          target: runner
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-runner-docs
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-runner
            type=gha,scope=runner
          cache-to: |
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-runner,mode=max,image-manifest=true,oci-mediatypes=true
            type=gha,scope=runner,mode=max

      - name: Build and push (with docs)
        id: push-docs
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: Containerfile
          target: runner-with-docs
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-docs.outputs.tags }}
          labels: ${{ steps.meta-docs.outputs.labels }}
          cache-from: type=gha,scope=runner
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-runner-docs,mode=max,image-manifest=true,oci-mediatypes=true

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Sign image (without docs)
        run: |
          IMAGE_REF=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          cosign sign --yes "${IMAGE_REF}@${{ steps.push.outputs.digest }}"

      - name: Sign image (with docs)
        run: |
          IMAGE_REF=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          cosign sign --yes "${IMAGE_REF}@${{ steps.push-docs.outputs.digest }}"

      - name: Prune old SHA-tagged versions
        uses: actions/github-script@v9.0.0
        with:
          script: |
            const owner = context.repo.owner.toLowerCase();
            const packageName = context.repo.repo.toLowerCase();

            const { data: versions } = await github.rest.packages.getAllPackageVersionsForPackageOwnedByAuthenticatedUser({
              package_type: 'container',
              package_name: packageName,
              per_page: 100,
            });

            const SHA_KEEP = 1;
            const shaVersions = [];

            for (const v of versions) {
              const tags = v.metadata?.container?.tags ?? [];
              const hasSemver = tags.some(t => /^v?\d+(\.\d+)*(-docs)?$/.test(t));
              const hasLatest = tags.some(t => ['latest', 'master', 'latest-docs', 'master-docs'].includes(t));
              if (hasSemver || hasLatest) continue;
              if (tags.some(t => t.startsWith('sha-'))) shaVersions.push(v);
            }

            shaVersions.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
            const toDelete = shaVersions.slice(SHA_KEEP);

            let pruned = 0;
            for (const v of toDelete) {
              const tags = v.metadata?.container?.tags ?? [];
              try {
                await github.rest.packages.deletePackageVersionForAuthenticatedUser({
                  package_type: 'container',
                  package_name: packageName,
                  package_version_id: v.id,
                });
                console.log(`Deleted version ${v.id} (tags: ${tags.join(', ') || 'untagged'})`);
                pruned++;
              } catch (err) {
                if (err.status === 404) {
                  console.log(`Skipping version ${v.id} — already deleted`);
                } else {
                  throw err;
                }
              }
            }
            console.log(`Pruned ${pruned} version(s).`);
