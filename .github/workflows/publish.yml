name: Publish Container Image

on:
  push:
    tags:
      - 'v*.*.*'

  workflow_dispatch:
    inputs:
      tag:
        description: 'Additional image tag (e.g. "v1.0.0"). SHA + latest are always added.'
        required: false
        type: string

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  publish:
    name: Build & Push
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Image metadata (without docs)
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
          labels: |
            org.opencontainers.image.title=Tab Pilot
            org.opencontainers.image.description=Real-time grooming and tab synchronization tool
            org.opencontainers.image.vendor=${{ github.repository_owner }}

      - name: Image metadata (with docs)
        id: meta-docs
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short,suffix=-docs
            type=semver,pattern={{version}},suffix=-docs
            type=semver,pattern={{major}}.{{minor}},suffix=-docs
            type=semver,pattern={{major}},suffix=-docs
            type=raw,value=latest-docs,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=raw,value=${{ inputs.tag }}-docs,enable=${{ inputs.tag != '' }}
          labels: |
            org.opencontainers.image.title=Tab Pilot (with docs)
            org.opencontainers.image.description=Real-time grooming and tab synchronization tool — bundled with documentation
            org.opencontainers.image.vendor=${{ github.repository_owner }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@v4.5.1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (without docs)
        id: push
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: Containerfile
          target: runner
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-runner-docs
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-runner
            type=gha,scope=runner
          cache-to: |
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-runner,mode=max,image-manifest=true,oci-mediatypes=true
            type=gha,scope=runner,mode=max

      - name: Build and push (with docs)
        id: push-docs
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: Containerfile
          target: runner-with-docs
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-docs.outputs.tags }}
          labels: ${{ steps.meta-docs.outputs.labels }}
          cache-from: type=gha,scope=runner
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-runner-docs,mode=max,image-manifest=true,oci-mediatypes=true

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Sign image (without docs)
        run: |
          IMAGE_REF=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          cosign sign --yes "${IMAGE_REF}@${{ steps.push.outputs.digest }}"

      - name: Sign image (with docs)
        run: |
          IMAGE_REF=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          cosign sign --yes "${IMAGE_REF}@${{ steps.push-docs.outputs.digest }}"

      - name: Summary
        run: |
          {
            echo "## Container Images Published :ship:"
            echo ""
            echo "| | Without docs | With docs |"
            echo "| --- | --- | --- |"
            echo "| **Digest** | \`${{ steps.push.outputs.digest }}\` | \`${{ steps.push-docs.outputs.digest }}\` |"
            echo "| **Platforms** | \`linux/amd64\`, \`linux/arm64\` | \`linux/amd64\`, \`linux/arm64\` |"
            echo ""
            echo "**Tags (without docs):**"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo ""
            echo "**Tags (with docs):**"
            echo '```'
            echo "${{ steps.meta-docs.outputs.tags }}"
            echo '```'
          } >> $GITHUB_STEP_SUMMARY
